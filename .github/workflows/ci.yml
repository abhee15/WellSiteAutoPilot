      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore WellSiteAutoPilot.slnx

      - name: Build
        run: dotnet build WellSiteAutoPilot.slnx --configuration Release --no-restore

      - name: Start provider simulator and Integration Gateway
        shell: bash
        run: |
          verifier() { printf '%s' "$1" | openssl dgst -sha256 -binary | base64 -w0; }
          SERVER_KEY=$(openssl rand -hex 32)
          WORKER_KEY=$(openssl rand -hex 32)
          echo "WSA_SERVER_KEY=$SERVER_KEY" >> "$GITHUB_ENV"
          echo "WSA_WORKER_KEY=$WORKER_KEY" >> "$GITHUB_ENV"
          export Security__Callers__server__Verifier=$(verifier "$SERVER_KEY")
          export Security__Callers__worker__Verifier=$(verifier "$WORKER_KEY")
          dotnet run --project src/simulators/WellSiteAutoPilot.ProviderSimulator/WellSiteAutoPilot.ProviderSimulator.csproj --configuration Release --no-build --urls http://127.0.0.1:5091 > simulator.log 2>&1 &
          echo $! > simulator.pid

          Providers__Simulator__BaseUrl=http://127.0.0.1:5091             dotnet run --project src/integration/WellSiteAutoPilot.IntegrationGateway/WellSiteAutoPilot.IntegrationGateway.csproj --configuration Release --no-build --urls http://127.0.0.1:5081 > gateway.log 2>&1 &
          echo $! > gateway.pid

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5091/health/ready >/dev/null &&
               curl --fail --silent http://127.0.0.1:5081/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat simulator.log || true
          cat gateway.log || true
          exit 1

      - name: Verify semantic engineering value through Gateway
        shell: bash
        run: |
          response=$(curl --fail --silent --get -H "Authorization: WSA-Service worker:$WSA_WORKER_KEY"             --data-urlencode "assetExternalId=WELL-101"             --data-urlencode "quantity=PumpFillage"             http://127.0.0.1:5081/api/internal/v1/data/current)

          echo "$response"

          RESPONSE="$response" python - <<'PY'
          import json
          import os

          value = json.loads(os.environ["RESPONSE"])
          assert value["quantity"] == "PumpFillage"
          assert value["value"] == 82
          assert value["unit"] == "%"
          assert value["quality"] == "Good"
          assert value["source"] == "simulator:WELL-101"
          PY

      - name: Verify Gateway caller authentication
        shell: bash
        run: |
          base=http://127.0.0.1:5081/api/internal/v1
          status() { curl --silent --output /dev/null --write-out '%{http_code}' "$@"; }
          expect() { if [ "$1" != "$2" ]; then echo "$3: expected HTTP $2 but got $1"; exit 1; fi; }

          expect "$(status "$base/adapters")" 401 "no credential"
          expect "$(status -H 'Authorization: WSA-Service server:wrong' "$base/adapters")" 401 "wrong key"
          expect "$(status -H "Authorization: WSA-Service nobody:$WSA_SERVER_KEY" "$base/adapters")" 401 "unknown caller"
          expect "$(status -H "Authorization: WSA-Service worker:$WSA_SERVER_KEY" "$base/adapters")" 401 "key presented under the wrong name"
          expect "$(status -H "Authorization: WSA-Service worker:$WSA_WORKER_KEY" "$base/adapters")" 403 "worker must not reach adapters"
          expect "$(status -H "Authorization: WSA-Service server:$WSA_SERVER_KEY" "$base/adapters")" 200 "server reaches adapters"
          expect "$(status "$base/data/current?assetExternalId=WELL-101&quantity=PumpFillage")" 401 "data without a credential"
          expect "$(status "$base/integrations")" 401 "integrations without a credential"
          # Health stays open for the installer and the readiness probes.
          expect "$(status http://127.0.0.1:5081/health/ready)" 200 "health"

          adapters=$(curl --fail --silent -H "Authorization: WSA-Service server:$WSA_SERVER_KEY" "$base/adapters")
          echo "$adapters" | python -c "import json,sys; d=json.load(sys.stdin); assert [a['key'] for a in d]==['simulator'], d; assert d[0]['fields'][0]['key']=='baseUrl', d"

          problems=$(curl --fail --silent -X POST -H 'Content-Type: application/json' -H "Authorization: WSA-Service server:$WSA_SERVER_KEY" \
            -d '{"settings":{"baseUrl":"ftp://x","extra":"1"}}' "$base/adapters/simulator/validate")
          echo "$problems" | python -c "import json,sys; d=json.load(sys.stdin)['problems']; assert {p['fieldKey'] for p in d}=={'baseUrl','extra'}, d"
          expect "$(status -X POST -H 'Content-Type: application/json' -H "Authorization: WSA-Service server:$WSA_SERVER_KEY" -d '{}' "$base/adapters/unknown/validate")" 404 "unknown adapter"

      - name: Show service logs on failure
        if: failure()
        shell: bash
        run: |
          cat simulator.log || true
          cat gateway.log || true

      - name: Stop services
        if: always()
        shell: bash
        run: |
          if test -f gateway.pid; then kill $(cat gateway.pid) || true; fi
          if test -f simulator.pid; then kill $(cat simulator.pid) || true; fi


  shadow-execution-e2e:
    name: Shadow execution end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WSA_DATABASE_CONNECTION_STRING: Host=127.0.0.1;Port=5432;Database=wellsite_autopilot;Username=wsa;Password=wsa_ci_password
      WSA_NATS_URL: nats://127.0.0.1:4222

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wsa
          POSTGRES_PASSWORD: wsa_ci_password
          POSTGRES_DB: wellsite_autopilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wsa -d wellsite_autopilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Start NATS with JetStream
        run: |
          docker run --detach --name wsa-nats-shadow-ci --publish 4222:4222 nats:2.15.0-alpine -js
          for attempt in {1..30}; do
            if docker logs wsa-nats-shadow-ci 2>&1 | grep -q "Server is ready"; then
              exit 0
            fi
            sleep 1
          done
          docker logs wsa-nats-shadow-ci
          exit 1

      - name: Restore and build
        run: |
          dotnet restore WellSiteAutoPilot.slnx
          dotnet build WellSiteAutoPilot.slnx --configuration Release --no-restore

      - name: Apply database migrations
        run: dotnet run --project tools/WellSiteAutoPilot.DatabaseMigrator/WellSiteAutoPilot.DatabaseMigrator.csproj --configuration Release --no-build

      - name: Start runtime processes
        shell: bash
        run: |
          verifier() { printf '%s' "$1" | openssl dgst -sha256 -binary | base64 -w0; }
          SERVER_KEY=$(openssl rand -hex 32)
          WORKER_KEY=$(openssl rand -hex 32)
          echo "WSA_SERVER_KEY=$SERVER_KEY" >> "$GITHUB_ENV"
          echo "WSA_WORKER_KEY=$WORKER_KEY" >> "$GITHUB_ENV"
          export Security__Callers__server__Verifier=$(verifier "$SERVER_KEY")
          export Security__Callers__worker__Verifier=$(verifier "$WORKER_KEY")
          dotnet run --project src/simulators/WellSiteAutoPilot.ProviderSimulator/WellSiteAutoPilot.ProviderSimulator.csproj --configuration Release --no-build --urls http://127.0.0.1:5091 > simulator.log 2>&1 &
          echo $! > simulator.pid

          Providers__Simulator__BaseUrl=http://127.0.0.1:5091             dotnet run --project src/integration/WellSiteAutoPilot.IntegrationGateway/WellSiteAutoPilot.IntegrationGateway.csproj --configuration Release --no-build --urls http://127.0.0.1:5081 > gateway.log 2>&1 &
          echo $! > gateway.pid

          Security__ServiceKey="$WORKER_KEY" Runtime__IntegrationGatewayUrl=http://127.0.0.1:5081             dotnet run --project src/workers/WellSiteAutoPilot.Worker.DotNet/WellSiteAutoPilot.Worker.DotNet.csproj --configuration Release --no-build --urls http://127.0.0.1:5082 > worker.log 2>&1 &
          echo $! > worker.pid

          Security__ServiceKey="$SERVER_KEY" ASPNETCORE_ENVIRONMENT=CI Swagger__Enabled=true Security__AuthenticationMode=TestHeader Security__BootstrapAdministrators__0='CI\wsa-admin' ConnectionStrings__WellSiteAutoPilot="$WSA_DATABASE_CONNECTION_STRING"             dotnet run --project src/server/WellSiteAutoPilot.Server/WellSiteAutoPilot.Server.csproj --configuration Release --no-build --urls http://127.0.0.1:5080 > server.log 2>&1 &
          echo $! > server.pid

          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:5091/health/ready >/dev/null &&
               curl --fail --silent http://127.0.0.1:5081/health/ready >/dev/null &&
               curl --fail --silent http://127.0.0.1:5082/health/ready >/dev/null &&
               curl --fail --silent http://127.0.0.1:5080/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat simulator.log || true
          cat gateway.log || true
          cat worker.log || true
          cat server.log || true
          exit 1

      - name: Verify paired grant runtime HTTP boundaries
        run: python3 tools/ci/verify_grant_administration.py

      - name: Verify retired raw dispatch and V1 messaging compatibility
        shell: bash
        run: |
          # Inject V1 through a test-only persistence fixture, never a product
          # HTTP endpoint accepting caller-supplied provider mappings.
          response=$(dotnet run --project tests/WellSiteAutoPilot.AssetApiTests/WellSiteAutoPilot.AssetApiTests.csproj --configuration Release --no-build -- --v1-fixture)
          execution_id=$(RESPONSE="$response" python - <<'PY'
          import json, os
          print(json.loads(os.environ["RESPONSE"])["executionId"])
          PY
          )

          completed=""
          for attempt in {1..45}; do
            state=$(curl --fail --silent -H 'X-WSA-Test-Identity: CI\wsa-admin' "http://127.0.0.1:5080/api/v1/executions/$execution_id")
            status=$(STATE="$state" python - <<'PY'
          import json, os
          print(json.loads(os.environ["STATE"])["status"])
          PY
            )

            if [ "$status" = "Completed" ]; then
              completed="$state"
              break
            fi

            if [ "$status" = "Failed" ]; then
              echo "$state"
              exit 1
            fi

            sleep 1
          done

          if [ -z "$completed" ]; then
            echo "Shadow execution did not complete in time."
            exit 1
          fi

          echo "$completed"

          STATE="$completed" python - <<'PY'
          import json, os
          execution=json.loads(os.environ["STATE"])
          assert execution["requestContractVersion"] == 1
          assert execution["mode"] == "Shadow"
          assert execution["correlationId"] == "ci-shadow-e2e"
          assert execution["resultCode"] == "SHADOW_MODULE_COMPLETED"
          output=json.loads(execution["outputJson"])
          result=output["engineeringResults"][0]
          assert result["quantity"] == "PumpFillage"
          assert result["value"] == 82
          assert result["unit"] == "%"
          assert output["controlIntents"] == []
          assert output["recommendations"] == []
          PY

          activity=$(curl --fail --silent -H 'X-WSA-Test-Identity: CI\wsa-admin' "http://127.0.0.1:5080/api/v1/executions?limit=10")
          ACTIVITY="$activity" EXECUTION_ID="$execution_id" python - <<'PY'
          import json, os
          activity=json.loads(os.environ["ACTIVITY"])
          execution_id=os.environ["EXECUTION_ID"]
          if not any(item["executionId"] == execution_id for item in activity):
              raise SystemExit("Recent execution activity did not contain the completed execution.")
          PY

      - name: Verify configured Shadow execution and result provenance
        run: dotnet run --project tests/WellSiteAutoPilot.AssetApiTests/WellSiteAutoPilot.AssetApiTests.csproj --configuration Release --no-build -- --configured-e2e

      - name: Show runtime logs on failure
        if: failure()
        shell: bash
        run: |
          cat simulator.log || true
          cat gateway.log || true
          cat worker.log || true
          cat server.log || true
          docker logs wsa-nats-shadow-ci || true

      - name: Stop runtime processes
        if: always()
        shell: bash
        run: |
          for pid_file in server.pid worker.pid gateway.pid simulator.pid; do
            if test -f "$pid_file"; then kill $(cat "$pid_file") || true; fi
          done
          docker rm --force wsa-nats-shadow-ci || true
