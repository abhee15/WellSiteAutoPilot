name: CI

on:
  # Draft and ready PRs run full validation. Do not also run the same
  # six-job suite on every feature-branch push when a PR exists.
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engineering-conventions:
    name: Engineering conventions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Empty on a push; pull_request runs compare against its exact base SHA.
      WSA_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Checkout history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test convention guards
        run: python -m unittest discover -s tests/ci -p 'test_*.py'
      - name: Verify architectural boundaries and generated client
        run: python tools/ci/check_conventions.py

  foundation-build:
    name: Foundation build and installer
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      WSA_VERSION: 0.1.0-dev.${{ github.run_number }}
      WSA_NATS_SERVER_VERSION: 2.15.0
      WSA_NATS_SERVER_SHA256: 2d0861dc2ca3567d17f7d19611d7b346cc2ccbd7086a0a77cc957a2c71663200

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore .NET
        run: dotnet restore WellSiteAutoPilot.slnx

      - name: Build .NET
        run: dotnet build WellSiteAutoPilot.slnx --configuration Release --no-restore

      - name: Verify failure contracts
        run: dotnet run --project tests/WellSiteAutoPilot.FailureContractTests/WellSiteAutoPilot.FailureContractTests.csproj --configuration Release --no-build

      - name: Verify authenticated external identity boundary
        run: dotnet run --project tests/WellSiteAutoPilot.IdentityBoundaryTests/WellSiteAutoPilot.IdentityBoundaryTests.csproj --configuration Release --no-build

      - name: Verify installer settings and database connection handling
        run: dotnet run --project tests/WellSiteAutoPilot.BootstrapperTests/WellSiteAutoPilot.BootstrapperTests.csproj --configuration Release --no-build
      - name: Verify pure scoped-grant authorization isolation
        run: dotnet run --project tests/WellSiteAutoPilot.ScopedGrantEvaluatorTests/WellSiteAutoPilot.ScopedGrantEvaluatorTests.csproj --configuration Release --no-build

      - name: Verify closed API value contracts
        run: dotnet run --project tests/WellSiteAutoPilot.ApiContractTests/WellSiteAutoPilot.ApiContractTests.csproj --configuration Release --no-build

      - name: Verify legacy Asset scope boundaries
        run: dotnet run --project tests/WellSiteAutoPilot.SecurityBoundaryTests/WellSiteAutoPilot.SecurityBoundaryTests.csproj --configuration Release --no-build

      - name: Verify Logic Module manifest contracts
        run: |
          dotnet run --project tests/WellSiteAutoPilot.LogicManifestTests/WellSiteAutoPilot.LogicManifestTests.csproj --configuration Release --no-build
          dotnet run --project tools/WellSiteAutoPilot.Cli/WellSiteAutoPilot.Cli.csproj --configuration Release --no-build -- module validate modules/samples/sample-shadow-read.manifest.json

      - name: Verify Logic Module SDK contracts
        run: dotnet run --project tests/WellSiteAutoPilot.ModuleSdkTests/WellSiteAutoPilot.ModuleSdkTests.csproj --configuration Release --no-build

      - name: Verify execution contract V2
        run: dotnet run --project tests/WellSiteAutoPilot.ExecutionContractV2Tests/WellSiteAutoPilot.ExecutionContractV2Tests.csproj --configuration Release --no-build

      - name: Verify deterministic Logic Module packaging
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/module-packages | Out-Null
          $manifest = "modules/samples/sample-shadow-read.manifest.json"
          $payload = "modules/samples/sample-shadow-read/payload"
          $package1 = "artifacts/module-packages/sample-shadow-read-1.wsamodule"
          $package2 = "artifacts/module-packages/sample-shadow-read-2.wsamodule"

          dotnet run --project tools/WellSiteAutoPilot.Cli/WellSiteAutoPilot.Cli.csproj --configuration Release --no-build -- module pack $manifest $payload $package1
          if ($LASTEXITCODE -ne 0) { throw "First module pack failed." }

          dotnet run --project tools/WellSiteAutoPilot.Cli/WellSiteAutoPilot.Cli.csproj --configuration Release --no-build -- module pack $manifest $payload $package2
          if ($LASTEXITCODE -ne 0) { throw "Second module pack failed." }

          $hash1 = (Get-FileHash $package1 -Algorithm SHA256).Hash
          $hash2 = (Get-FileHash $package2 -Algorithm SHA256).Hash
          if ($hash1 -ne $hash2) {
            throw "Logic Module packaging is not deterministic."
          }

          dotnet run --project tools/WellSiteAutoPilot.Cli/WellSiteAutoPilot.Cli.csproj --configuration Release --no-build -- module verify $package1
          if ($LASTEXITCODE -ne 0) { throw "Logic Module package verification failed." }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $package1))
          try {
            $names = @($archive.Entries | ForEach-Object { $_.FullName })
            if ($names -notcontains "manifest.json" -or
                $names -notcontains "payload/README.txt") {
              throw "Logic Module package did not contain the expected manifest and payload entries."
            }
          }
          finally {
            $archive.Dispose()
          }

      - name: Verify provider-neutral integration contracts
        run: dotnet run --project tests/WellSiteAutoPilot.ProviderContractTests/WellSiteAutoPilot.ProviderContractTests.csproj --configuration Release --no-build

      - name: Generate OpenAPI contract
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/openapi/v1 | Out-Null
          $env:ASPNETCORE_ENVIRONMENT = "Development"
          $env:Swagger__Enabled = "true"
          $stdout = "artifacts/openapi/server-startup.stdout.log"
          $stderr = "artifacts/openapi/server-startup.stderr.log"
          $server = Start-Process dotnet -ArgumentList @(
            "run",
            "--project", "src/server/WellSiteAutoPilot.Server/WellSiteAutoPilot.Server.csproj",
            "--configuration", "Release",
            "--no-build",
            "--urls", "http://127.0.0.1:5080"
          ) -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try {
                Invoke-WebRequest "http://127.0.0.1:5080/health/live" -UseBasicParsing | Out-Null
                $ready = $true
                break
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) {
              if (Test-Path $stdout) { Get-Content $stdout }
              if (Test-Path $stderr) { Get-Content $stderr }
              throw "WellSite AutoPilot Server did not become ready for OpenAPI generation."
            }

            Invoke-WebRequest "http://127.0.0.1:5080/swagger/v1/swagger.json" -UseBasicParsing -OutFile "artifacts/openapi/v1/server.json"
            $openApi = Get-Content "artifacts/openapi/v1/server.json" -Raw | ConvertFrom-Json
            $paths = @($openApi.paths.PSObject.Properties.Name)
            $requiredPaths = @(
              "/api/v1/system/info",
              "/api/v1/security/me",
              "/api/v1/security/users",
              "/api/v1/logic-modules",
              "/api/v1/logic-modules/{moduleId}/{moduleVersion}",
              "/api/v1/executions",
              "/api/v1/asset-types",
              "/api/v1/asset-types/{assetTypeId}",
              "/api/v1/assets",
              "/api/v1/assets/{assetId}",
              "/api/v1/configured-logic",
              "/api/v1/configured-logic/{configuredLogicId}",
              "/api/v1/configured-logic/{configuredLogicId}/revisions",
              "/api/v1/configured-logic/{configuredLogicId}/revisions/{revisionId}/validate",
              "/api/v1/configured-logic/{configuredLogicId}/revisions/{revisionId}/activate",
              "/api/v1/configured-logic/{configuredLogicId}/revisions/{revisionId}/shadow",
              "/api/v1/executions/{executionId}"
            )

            foreach ($requiredPath in $requiredPaths) {
              if ($paths -notcontains $requiredPath) {
                Write-Host "OpenAPI paths:"
                $paths | Sort-Object | ForEach-Object { Write-Host "  $_" }
                throw "OpenAPI v1 did not contain expected route: $requiredPath"
              }
            }

            if ($paths -contains "/api/v1/executions/shadow") {
              throw "Retired raw dispatch must not be published in OpenAPI."
            }

            # API-owned finite values must be published as string enums and
            # referenced by their fields so the generated client emits unions.
            $closedValues = [ordered]@{
              AccessGrantSubjectKind = "User,WindowsGroup"
              AccessGrantScopeKind = "ExactAssets,DeploymentWide,AllAssets"
              ExecutionMode = "Shadow,Recommendation,Autonomous"
              ExecutionStatus = "Requested,Queued,Starting,Running,Waiting,Completed,Failed,Cancelled,Suspended,TimedOut"
              ExecutionTriggerKind = "Manual,Scheduled"
              LogicRuntimeKind = "Python,DotNet"
              ExecutionProfile = "ScheduledOneShot,BoundedIterative,Reactive,ContinuousController,DurableWorkflow"
              LogicModuleTrustStatus = "Untrusted,TrustedPublisher,CustomerApproved,SignatureInvalid"
              RecommendationStatus = "Created,Pending,Approved,Rejected,Expired,Superseded,Invalidated,Executed"
              RecommendationDecision = "Approved,Rejected"
              ConfiguredLogicRevisionStatus = "Draft,Validated,Active,Superseded"
              PlatformComponentStatus = "Unknown,Healthy,Degraded,Unavailable"
            }
            foreach ($name in $closedValues.Keys) {
              $schema = $openApi.components.schemas.$name
              if (-not $schema) { throw "OpenAPI did not publish closed value schema $name." }
              $actual = (@($schema.enum) | Sort-Object) -join ","
              $expected = (($closedValues[$name] -split ",") | Sort-Object) -join ","
              if ($schema.type -ne "string" -or $actual -ne $expected) {
                throw "OpenAPI schema $name must be a string enum of [$expected] but was type '$($schema.type)' [$actual]."
              }
            }

            $closedFields = [ordered]@{
              "AccessGrantResponse.subjectKind" = "AccessGrantSubjectKind"
              "AccessGrantResponse.scopeKind" = "AccessGrantScopeKind"
              "CreateAccessGrantRequest.scopeKind" = "AccessGrantScopeKind"
              "ExecutionResponse.trigger" = "ExecutionTriggerKind"
              "ExecutionResponse.mode" = "ExecutionMode"
              "ExecutionResponse.status" = "ExecutionStatus"
              "ConfiguredShadowReceiptResponse.mode" = "ExecutionMode"
              "ConfiguredShadowReceiptResponse.trigger" = "ExecutionTriggerKind"
              "LogicModuleResponse.runtime" = "LogicRuntimeKind"
              "LogicModuleResponse.executionProfile" = "ExecutionProfile"
              "LogicModuleResponse.trustStatus" = "LogicModuleTrustStatus"
              "RecommendationSummaryResponse.status" = "RecommendationStatus"
              "RecommendationDecisionRequest.decision" = "RecommendationDecision"
              "RecommendationDecisionResponse.status" = "RecommendationStatus"
              "ConfiguredLogicRevisionResponse.mode" = "ExecutionMode"
              "ConfiguredLogicRevisionResponse.status" = "ConfiguredLogicRevisionStatus"
              "PlatformComponentResponse.status" = "PlatformComponentStatus"
            }
            foreach ($field in $closedFields.Keys) {
              $owner, $property = $field -split "\."
              $definition = $openApi.components.schemas.$owner.properties.$property
              $reference = ConvertTo-Json $definition -Depth 10 -Compress
              if (-not $definition -or $reference -notmatch ('#/components/schemas/' + $closedFields[$field] + '"')) {
                throw "OpenAPI field $field must reference closed value schema $($closedFields[$field]) but was $reference."
              }
            }

            if ($paths | Where-Object { $_ -match 'v\\{version' }) {
              throw "OpenAPI v1 still contained an unsubstituted API version route."
            }
          }
          finally {
            if ($server -and -not $server.HasExited) {
              Stop-Process -Id $server.Id -Force
            }
          }

      # Each command must be independently blocking: PowerShell can otherwise
      # report success from the last npm command after an earlier failure.
      - name: Install frontend dependencies
        working-directory: src/web
        run: npm ci

      - name: Generate TypeScript API client
        working-directory: src/web
        run: npm run generate-api

      - name: Lint frontend
        working-directory: src/web
        run: npm run lint

      - name: Test frontend
        working-directory: src/web
        run: npm run test:ui

      - name: Test frontend interactions
        working-directory: src/web
        run: npm run test:interaction

      - name: Build frontend
        working-directory: src/web
        run: npm run build

      - name: Validate Python worker
        run: python -m compileall -q src/workers/python/src

      - name: Publish server
        run: dotnet publish src/server/WellSiteAutoPilot.Server/WellSiteAutoPilot.Server.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/server

      - name: Publish integration gateway
        run: dotnet publish src/integration/WellSiteAutoPilot.IntegrationGateway/WellSiteAutoPilot.IntegrationGateway.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/gateway

      - name: Publish .NET worker
        run: dotnet publish src/workers/WellSiteAutoPilot.Worker.DotNet/WellSiteAutoPilot.Worker.DotNet.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/worker-dotnet

      - name: Publish provider simulator
        run: dotnet publish src/simulators/WellSiteAutoPilot.ProviderSimulator/WellSiteAutoPilot.ProviderSimulator.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/provider-simulator

      - name: Publish NATS Windows service host
        run: dotnet publish src/infrastructure/WellSiteAutoPilot.NatsHost/WellSiteAutoPilot.NatsHost.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/nats-host

      - name: Publish bootstrapper
        run: dotnet publish tools/WellSiteAutoPilot.Bootstrapper/WellSiteAutoPilot.Bootstrapper.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/bootstrapper

      - name: Publish database migrator
        run: dotnet publish tools/WellSiteAutoPilot.DatabaseMigrator/WellSiteAutoPilot.DatabaseMigrator.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/database-migrator

      - name: Publish CLI
        run: dotnet publish tools/WellSiteAutoPilot.Cli/WellSiteAutoPilot.Cli.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/cli

      - name: Stage pinned NATS server
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "nats-server.zip"
          $extractRoot = Join-Path $env:RUNNER_TEMP "nats-server"
          $url = "https://github.com/nats-io/nats-server/releases/download/v$env:WSA_NATS_SERVER_VERSION/nats-server-v$env:WSA_NATS_SERVER_VERSION-windows-amd64.zip"

          Invoke-WebRequest $url -UseBasicParsing -OutFile $archive

          $actualHash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:WSA_NATS_SERVER_SHA256.ToLowerInvariant()) {
            throw "NATS server checksum mismatch. Expected $env:WSA_NATS_SERVER_SHA256, actual $actualHash."
          }

          if (Test-Path $extractRoot) {
            Remove-Item -Recurse -Force $extractRoot
          }
          Expand-Archive $archive -DestinationPath $extractRoot

          $natsExe = Get-ChildItem $extractRoot -Filter "nats-server.exe" -Recurse | Select-Object -First 1
          $license = Get-ChildItem $extractRoot -Filter "LICENSE" -Recurse | Select-Object -First 1
          if (-not $natsExe) {
            throw "The pinned NATS server archive did not contain nats-server.exe."
          }

          New-Item -ItemType Directory -Force artifacts/nats | Out-Null
          Copy-Item $natsExe.FullName artifacts/nats/nats-server.exe
          if ($license) {
            Copy-Item $license.FullName artifacts/nats/LICENSE
          }

          & artifacts/nats/nats-server.exe --version

      - name: Stage web assets and Python worker
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/server/wwwroot | Out-Null
          Copy-Item -Recurse -Force src/web/dist/* artifacts/server/wwwroot/
          New-Item -ItemType Directory -Force artifacts/python-worker | Out-Null
          Copy-Item -Recurse -Force src/workers/python/pyproject.toml artifacts/python-worker/
          Copy-Item -Recurse -Force src/workers/python/src artifacts/python-worker/

      - name: Smoke test published server and UI
        shell: pwsh
        run: |
          $env:ASPNETCORE_ENVIRONMENT = "Production"
          $serverPath = (Resolve-Path "artifacts/server/WellSiteAutoPilot.Server.exe").Path
          $server = Start-Process -FilePath $serverPath -ArgumentList @(
            "--urls", "http://127.0.0.1:5090"
          ) -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try {
                Invoke-WebRequest "http://127.0.0.1:5090/health/live" -UseBasicParsing | Out-Null
                $ready = $true
                break
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) {
              throw "Published WellSite AutoPilot Server did not become healthy."
            }

            $page = Invoke-WebRequest "http://127.0.0.1:5090/" -UseBasicParsing
            if ($page.StatusCode -ne 200 -or $page.Content -notmatch "WellSite AutoPilot") {
              throw "Published Server did not serve the WellSite AutoPilot UI."
            }
          }
          finally {
            if ($server -and -not $server.HasExited) {
              Stop-Process -Id $server.Id -Force
            }
          }

      - name: Write release manifest
        shell: pwsh
        run: |
          @{
            product = "WellSite AutoPilot"
            version = $env:WSA_VERSION
            commit = "${{ github.sha }}"
            build = ${{ github.run_number }}
            generatedAtUtc = (Get-Date).ToUniversalTime().ToString("O")
            natsServerVersion = $env:WSA_NATS_SERVER_VERSION
          } | ConvertTo-Json | Set-Content artifacts/release-manifest.json

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "$env:ProgramFiles\NSIS\makensis.exe"
          )
          $makensis = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $makensis) {
            throw "makensis.exe was not found after installing NSIS."
          }

          $staging = (Resolve-Path artifacts).Path
          $outFile = Join-Path $staging "WellSiteAutoPilot-$env:WSA_VERSION-Setup.exe"
          & $makensis "/DVERSION=$env:WSA_VERSION" "/DSTAGING=$staging" "/DOUTFILE=$outFile" "installer\nsis\WellSiteAutoPilot.nsi"
          if ($LASTEXITCODE -ne 0) {
            throw "NSIS failed with exit code $LASTEXITCODE."
          }

      - name: Smoke test installer
        shell: pwsh
        run: |
          # Surface the failing check as an annotation (job logs are not always retrievable).
          trap {
            $message = ($_.Exception.Message -replace "\r?\n", " | ")
            Write-Host "::error title=Installer smoke test::$message (script line $($_.InvocationInfo.ScriptLineNumber))"
            exit 1
          }
          $installer = (Resolve-Path "artifacts\WellSiteAutoPilot-$env:WSA_VERSION-Setup.exe").Path
          $installRoot = Join-Path $env:ProgramFiles "Weatherford\WellSite AutoPilot CI"
          if (Test-Path $installRoot) {
            Remove-Item -Recurse -Force $installRoot
          }

          # The installer needs an existing PostgreSQL database. The runner image's PostgreSQL 17
          # (public fixture credential, as in the Windows browser fixture) hosts a disposable one.
          $pgBin = "C:\Program Files\PostgreSQL\17\bin"
          $psql = Join-Path $pgBin "psql.exe"
          if (-not (Test-Path -LiteralPath $psql)) { throw "Expected runner PostgreSQL 17 installation is missing." }
          $postgres = Get-Service "postgresql-x64-17"
          if ($postgres.Status -ne "Running") {
            if ($postgres.StartType -eq "Disabled") { Set-Service $postgres -StartupType Manual }
            Start-Service $postgres
          }
          $smokeDatabase = "wsa_installer_smoke"
          $env:PGPASSWORD = "root"
          & $psql -h 127.0.0.1 -U postgres -d postgres -w -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS $smokeDatabase WITH (FORCE)" -c "CREATE DATABASE $smokeDatabase"
          if ($LASTEXITCODE -ne 0) { throw "Smoke database creation failed." }

          # The installer takes the connection from the environment so the password is never on a command line.
          $env:WSA_DATABASE_USER = "postgres"
          $env:WSA_DATABASE_PASSWORD = "root"
          $env:WSA_DATABASE_NAME = $smokeDatabase

          # CI\wsa-admin is a fake account; production installs verify the account exists.
          $env:WSA_ALLOW_UNRESOLVED_BOOTSTRAP_ADMIN = "1"
          # A non-default port proves the port is configurable, reaches the firewall rule, and survives the
          # upgrade below, which does not repeat it.
          $smokePort = 5090

          # The Server serves HTTPS only. A non-exportable machine certificate stands in for one from the
          # organisation's authority: the Server's account cannot read its key until the installer grants it.
          function Get-ServedThumbprint([int]$port) {
            $client = [System.Net.Sockets.TcpClient]::new("127.0.0.1", $port)
            try {
              $accept = [System.Net.Security.RemoteCertificateValidationCallback]{ param($sender, $certificate, $chain, $errors) $true }
              $ssl = [System.Net.Security.SslStream]::new($client.GetStream(), $false, $accept)
              $ssl.AuthenticateAsClient($env:COMPUTERNAME)
              return [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($ssl.RemoteCertificate).Thumbprint
            } finally {
              $client.Dispose()
            }
          }
          function Wait-ServedThumbprint([int]$port, [string]$expected) {
            $served = ""
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              try { $served = Get-ServedThumbprint $port } catch { $served = "" }
              if ($served -eq $expected) { return }
              Start-Sleep -Seconds 1
            }
            throw "Server serves certificate '$served' on port $port but '$expected' was expected."
          }
          # The certificate cmdlets belong to Windows PowerShell; PowerShell 7 would hand back deserialized copies.
          function Invoke-WindowsPowerShell([string]$command) {
            $script = '$ProgressPreference = "SilentlyContinue"' + [Environment]::NewLine + $command
            $encoded = [Convert]::ToBase64String([System.Text.Encoding]::Unicode.GetBytes($script))
            $output = & powershell.exe -NoProfile -NonInteractive -EncodedCommand $encoded 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) { throw "Windows PowerShell failed: $output" }
            return ($output -split "\r?\n" | Where-Object { $_.Trim() } | Select-Object -Last 1).Trim()
          }
          $storeThumbprint = Invoke-WindowsPowerShell @'
          $c = New-SelfSignedCertificate -DnsName $env:COMPUTERNAME,'localhost' -CertStoreLocation Cert:\LocalMachine\My -KeyExportPolicy NonExportable -NotAfter (Get-Date).AddDays(30)
          $c.Thumbprint
          '@
          $install = Start-Process -FilePath $installer -ArgumentList @(
            "/S",
            "/BOOTSTRAPADMIN=CI\wsa-admin",
            "/PORT=$smokePort",
            "/CERTTHUMBPRINT=$storeThumbprint",
            "/D=$installRoot"
          ) -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            # Re-run the bootstrapper directly so its own message reaches the annotation.
            $diagnostic = "Processes still running from the install folder: " +
              ((Get-Process | Where-Object { $_.Path -and $_.Path -like "$installRoot*" } | ForEach-Object { "$($_.Name)($($_.Id))" }) -join ", ") +
              ". Services: " +
              ((Get-Service "Weatherford.WellSiteAutoPilot.*" -ErrorAction SilentlyContinue | ForEach-Object { "$($_.Name)=$($_.Status)" }) -join ", ") + ". "
            $stepsLog = Join-Path $env:ProgramData "Weatherford\WellSite AutoPilot\Diagnostics\installer-steps.log"
            if (Test-Path $stepsLog) { $diagnostic += "Installer steps: " + ((Get-Content $stepsLog -Raw) -replace "\s+", " ") + " " }
            $stepsLog = Join-Path $env:ProgramData "Weatherford\WellSite AutoPilot\Diagnostics\installer-steps.log"
            if (Test-Path $stepsLog) { $diagnostic += "Installer steps: " + ((Get-Content $stepsLog -Raw) -replace "\s+", " ") + " " }
            $bootstrapper = Join-Path $installRoot "Tools\Bootstrapper\WellSiteAutoPilot.Bootstrapper.exe"
            if (Test-Path $bootstrapper) {
              $diagnostic += (& $bootstrapper install-services --install-root $installRoot --bootstrap-admin "CI\wsa-admin" 2>&1 | Out-String)
            }
            throw "Installer smoke test failed with exit code $($install.ExitCode). Bootstrapper says: $diagnostic"
          }

          $securitySettingsPath = Join-Path $env:ProgramData "Weatherford\WellSite AutoPilot\server.settings.json"
          if (-not (Test-Path $securitySettingsPath)) {
            throw "Installer did not create ProgramData security settings."
          }

          $securitySettings = Get-Content $securitySettingsPath -Raw | ConvertFrom-Json
          $bootstrapAdmins = @($securitySettings.Security.BootstrapAdministrators)
          if ($bootstrapAdmins.Count -ne 1 -or $bootstrapAdmins[0] -ne "CI\wsa-admin") {
            throw "Installer did not preserve the explicit bootstrap administrator identity."
          }

          # The installer must configure the database connection, protect it, and migrate the schema.
          $storedConnection = $securitySettings.ConnectionStrings.WellSiteAutoPilot
          if (-not $storedConnection -or $storedConnection -notmatch "Database=$smokeDatabase" -or $storedConnection -notmatch "Password=root") {
            throw "Installer did not store the database connection in the machine settings file."
          }

          $settingsAcl = Get-Acl -LiteralPath $securitySettingsPath
          $settingsPrincipals = @($settingsAcl.Access | ForEach-Object { $_.IdentityReference.Value })
          if ($settingsPrincipals -notcontains "NT AUTHORITY\NETWORK SERVICE") {
            throw "Settings file is not readable by the Server account. Access: $($settingsPrincipals -join ', ')"
          }
          foreach ($principal in $settingsPrincipals) {
            if ($principal -match "Users|Everyone|LOCAL SERVICE|Authenticated") {
              throw "Settings file holding the database password is readable by $principal."
            }
          }

          $migrations = & $psql -h 127.0.0.1 -U postgres -d $smokeDatabase -w -t -A -c 'SELECT count(*) FROM "__EFMigrationsHistory"'
          if ($LASTEXITCODE -ne 0 -or [int]$migrations -lt 1) {
            throw "Installer did not apply database migrations (history rows: $migrations)."
          }

          # Negotiate needs a network identity: the Server runs as NetworkService, the others as LocalService.
          $expectedAccounts = @{
            "Weatherford.WellSiteAutoPilot.Server" = "NT AUTHORITY\NetworkService"
            "Weatherford.WellSiteAutoPilot.Nats" = "NT AUTHORITY\LocalService"
            "Weatherford.WellSiteAutoPilot.IntegrationGateway" = "NT AUTHORITY\LocalService"
            "Weatherford.WellSiteAutoPilot.Worker.DotNet" = "NT AUTHORITY\LocalService"
          }
          foreach ($serviceName in $expectedAccounts.Keys) {
            $account = (Get-CimInstance Win32_Service -Filter "Name='$serviceName'").StartName
            if ($account -ne $expectedAccounts[$serviceName]) {
              throw "Service $serviceName runs as '$account' but should run as '$($expectedAccounts[$serviceName])'."
            }
          }

          # Reachable from the network by default: the Firewall allows only the Server, on Domain and Private networks.
          $rule = Get-NetFirewallRule -DisplayName "WellSiteAutoPilot.Server" -ErrorAction SilentlyContinue
          if (-not $rule -or $rule.Enabled -ne "True" -or $rule.Direction -ne "Inbound" -or $rule.Action -ne "Allow") {
            throw "Installer did not create an enabled inbound allow firewall rule for the Server."
          }
          if (([string]$rule.Profile) -match "Public" -or -not (([string]$rule.Profile) -match "Domain" -and ([string]$rule.Profile) -match "Private")) {
            throw "Firewall rule must cover Domain and Private networks only but covers: $($rule.Profile)."
          }
          $ruleFilter = $rule | Get-NetFirewallPortFilter
          if ($ruleFilter.LocalPort -ne "$smokePort" -or $ruleFilter.Protocol -ne "TCP") {
            throw "Firewall rule must allow TCP $smokePort only."
          }
          if (-not (($rule | Get-NetFirewallApplicationFilter).Program -like "*Server\WellSiteAutoPilot.Server.exe")) {
            throw "Firewall rule must be bound to the Server executable."
          }

          $required = @(
            "Server\WellSiteAutoPilot.Server.exe",
            "IntegrationGateway\WellSiteAutoPilot.IntegrationGateway.exe",
            "Workers\DotNet\WellSiteAutoPilot.Worker.DotNet.exe",
            "ProviderSimulator\WellSiteAutoPilot.ProviderSimulator.exe",
            "Infrastructure\NATS\nats-server.exe",
            "Infrastructure\NATSHost\WellSiteAutoPilot.NatsHost.exe",
            "Tools\Bootstrapper\WellSiteAutoPilot.Bootstrapper.exe",
            "Tools\DatabaseMigrator\WellSiteAutoPilot.DatabaseMigrator.exe",
            "Tools\Cli\WellSiteAutoPilot.Cli.exe",
            "Server\wwwroot\index.html",
            "Uninstall.exe"
          )

          foreach ($relativePath in $required) {
            $installedPath = Join-Path $installRoot $relativePath
            if (-not (Test-Path $installedPath)) {
              throw "Installer smoke test did not install required file: $relativePath"
            }
          }

          $services = @(
            "Weatherford.WellSiteAutoPilot.Nats",
            "Weatherford.WellSiteAutoPilot.Server",
            "Weatherford.WellSiteAutoPilot.IntegrationGateway",
            "Weatherford.WellSiteAutoPilot.Worker.DotNet"
          )

          foreach ($serviceName in $services) {
            $running = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              $service = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
              if ($service -and $service.Status -eq "Running") {
                $running = $true
                break
              }
              Start-Sleep -Seconds 1
            }

            if (-not $running) {
              throw "Installed Windows service did not reach Running: $serviceName"
            }
          }

          $natsReady = $false
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            $probe = Test-NetConnection -ComputerName 127.0.0.1 -Port 4222 -WarningAction SilentlyContinue
            if ($probe.TcpTestSucceeded) {
              $natsReady = $true
              break
            }
            Start-Sleep -Seconds 1
          }

          if (-not $natsReady) {
            throw "Installed NATS service did not accept connections on loopback port 4222."
          }

          $env:WSA_NATS_URL = "nats://127.0.0.1:4222"
          dotnet run --project tests/WellSiteAutoPilot.MessagingIntegrationTests/WellSiteAutoPilot.MessagingIntegrationTests.csproj --configuration Release --no-build
          if ($LASTEXITCODE -ne 0) {
            throw "Installed NATS JetStream validation failed with exit code $LASTEXITCODE."
          }

          $uiReady = $false
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            try {
              $page = Invoke-WebRequest "https://127.0.0.1:$smokePort/" -SkipCertificateCheck -UseBasicParsing
              if ($page.StatusCode -eq 200 -and $page.Content -match "WellSite AutoPilot") {
                $uiReady = $true
                break
              }
            } catch {
              Start-Sleep -Seconds 1
            }
          }

          if (-not $uiReady) {
            throw "Installed WellSite AutoPilot Server did not serve the UI."
          }

          Wait-ServedThumbprint $smokePort $storeThumbprint
          $tlsSettings = Get-Content $securitySettingsPath -Raw | ConvertFrom-Json
          if ($tlsSettings.Tls.Thumbprint -ne $storeThumbprint -or $tlsSettings.Installer.CertificateSource -ne "Store") {
            throw "Installer did not remember the chosen certificate."
          }
          $httpAnswered = $false
          try {
            Invoke-WebRequest "http://127.0.0.1:$smokePort/" -UseBasicParsing -TimeoutSec 5 | Out-Null
            $httpAnswered = $true
          } catch {
            # Expected: the TLS-only port does not speak HTTP.
          }
          if ($httpAnswered) { throw "The Server answered plain HTTP; it must serve HTTPS only." }

          # The Server's background services query the database as soon as it starts; seeing its own
          # authenticated connection proves the installed service really uses the stored connection.
          $serverConnected = $false
          for ($attempt = 0; $attempt -lt 40; $attempt++) {
            $connections = & $psql -h 127.0.0.1 -U postgres -d postgres -w -t -A -c "SELECT count(*) FROM pg_stat_activity WHERE datname = '$smokeDatabase'"
            if ($LASTEXITCODE -eq 0 -and [int]$connections -gt 0) {
              $serverConnected = $true
              break
            }
            Start-Sleep -Seconds 1
          }

          if (-not $serverConnected) {
            throw "Installed Server never opened a connection to the configured database."
          }

          # The Server listens on every interface, the other services only on loopback.
          $listeners = @(Get-NetTCPConnection -State Listen -LocalPort $smokePort -ErrorAction SilentlyContinue)
          if (-not ($listeners | Where-Object { $_.LocalAddress -in @("0.0.0.0", "::") })) {
            throw "Server is not listening on all interfaces: $(($listeners.LocalAddress) -join ', ')"
          }
          if (@(Get-NetTCPConnection -State Listen -LocalPort 5080 -ErrorAction SilentlyContinue).Count -gt 0) {
            throw "Port 5080 is in use but the Server was installed on $smokePort."
          }
          foreach ($port in 5081, 5082, 4222) {
            $open = @(Get-NetTCPConnection -State Listen -LocalPort $port -ErrorAction SilentlyContinue |
              Where-Object { $_.LocalAddress -in @("0.0.0.0", "::") })
            if ($open.Count -gt 0) { throw "Port $port must stay on loopback but listens on all interfaces." }
          }
          $networkAddress = (Get-NetIPAddress -AddressFamily IPv4 |
            Where-Object { $_.IPAddress -notlike "127.*" -and $_.IPAddress -notlike "169.254.*" } |
            Select-Object -First 1).IPAddress
          if ($networkAddress) {
            $viaNetwork = Invoke-WebRequest "https://${networkAddress}:$smokePort/" -SkipCertificateCheck -UseBasicParsing
            if ($viaNetwork.StatusCode -ne 200) { throw "Server did not answer on the network address $networkAddress." }
          }

          $workerReady = $false
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            try {
              Invoke-WebRequest "http://127.0.0.1:5082/health/ready" -UseBasicParsing | Out-Null
              $workerReady = $true
              break
            } catch {
              Start-Sleep -Seconds 1
            }
          }

          if (-not $workerReady) {
            throw "Installed .NET worker health endpoint did not become ready."
          }

          # Upgrade over a running installation: no database or administrator arguments. The stored
          # connection must be kept, services replaced, and the schema left current.
          Remove-Item Env:WSA_DATABASE_USER, Env:WSA_DATABASE_PASSWORD, Env:WSA_DATABASE_NAME
          $upgrade = Start-Process -FilePath $installer -ArgumentList @("/S", "/D=$installRoot") -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) {
            $diagnostic = "Processes still running from the install folder: " +
              ((Get-Process | Where-Object { $_.Path -and $_.Path -like "$installRoot*" } | ForEach-Object { "$($_.Name)($($_.Id))" }) -join ", ") +
              ". Services: " +
              ((Get-Service "Weatherford.WellSiteAutoPilot.*" -ErrorAction SilentlyContinue | ForEach-Object { "$($_.Name)=$($_.Status)" }) -join ", ") + ". "
            $bootstrapper = Join-Path $installRoot "Tools\Bootstrapper\WellSiteAutoPilot.Bootstrapper.exe"
            if (Test-Path $bootstrapper) {
              $diagnostic += (& $bootstrapper install-services --install-root $installRoot 2>&1 | Out-String)
            }
            throw "Installer upgrade over a running installation failed with exit code $($upgrade.ExitCode). Bootstrapper says: $diagnostic"
          }

          foreach ($serviceName in $expectedAccounts.Keys) {
            $upgraded = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              $service = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
              if ($service -and $service.Status -eq "Running") { $upgraded = $true; break }
              Start-Sleep -Seconds 1
            }
            if (-not $upgraded) { throw "Service did not run after upgrade: $serviceName" }
            $account = (Get-CimInstance Win32_Service -Filter "Name='$serviceName'").StartName
            if ($account -ne $expectedAccounts[$serviceName]) {
              throw "After upgrade $serviceName runs as '$account' but should run as '$($expectedAccounts[$serviceName])'."
            }
          }

          $upgradedSettings = Get-Content $securitySettingsPath -Raw | ConvertFrom-Json
          if ($upgradedSettings.ConnectionStrings.WellSiteAutoPilot -ne $storedConnection) {
            throw "Upgrade changed or lost the stored database connection."
          }

          $upgradedAdmins = @($upgradedSettings.Security.BootstrapAdministrators)
          if ($upgradedAdmins.Count -ne 1 -or $upgradedAdmins[0] -ne "CI\wsa-admin") {
            throw "Upgrade changed the bootstrap administrator."
          }

          $migrationsAfter = & $psql -h 127.0.0.1 -U postgres -d $smokeDatabase -w -t -A -c 'SELECT count(*) FROM "__EFMigrationsHistory"'
          if ($LASTEXITCODE -ne 0 -or [int]$migrationsAfter -ne [int]$migrations) {
            throw "Upgrade changed the migration history ($migrations before, $migrationsAfter after)."
          }

          $upgradeUi = $false
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            try {
              $page = Invoke-WebRequest "https://127.0.0.1:$smokePort/" -SkipCertificateCheck -UseBasicParsing
              if ($page.StatusCode -eq 200) { $upgradeUi = $true; break }
            } catch {
              Start-Sleep -Seconds 1
            }
          }
          if (-not $upgradeUi) { throw "Server did not serve the UI after upgrade." }
          Wait-ServedThumbprint $smokePort $storeThumbprint

          # Switch certificate source through the bootstrapper: a generated self-signed certificate, then a PFX
          # file whose certificate is first removed from the store so the import is what puts it back.
          $bootstrapperExe = Join-Path $installRoot "Tools\Bootstrapper\WellSiteAutoPilot.Bootstrapper.exe"
          function Invoke-BootstrapperInstall([string[]]$extra) {
            $output = & $bootstrapperExe install-services --install-root $installRoot @extra 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) { throw "Bootstrapper $extra failed: $output" }
            return $output
          }

          $null = Invoke-BootstrapperInstall @("--cert-self-signed")
          $selfSignedSettings = Get-Content $securitySettingsPath -Raw | ConvertFrom-Json
          $selfSignedThumbprint = $selfSignedSettings.Tls.Thumbprint
          if ($selfSignedSettings.Installer.CertificateSource -ne "SelfSigned" -or $selfSignedThumbprint -eq $storeThumbprint) {
            throw "A self-signed certificate was not created and remembered."
          }
          Wait-ServedThumbprint $smokePort $selfSignedThumbprint

          $pfxPath = Join-Path $env:RUNNER_TEMP "wsa-ci-server.pfx"
          $pfxPassword = "ci-" + [guid]::NewGuid().ToString("N")
          $env:WSA_CI_PFX_PATH = $pfxPath
          $env:WSA_CI_PFX_PASSWORD = $pfxPassword
          $pfxThumbprint = Invoke-WindowsPowerShell @'
          $c = New-SelfSignedCertificate -DnsName $env:COMPUTERNAME,'localhost' -CertStoreLocation Cert:\LocalMachine\My -KeyExportPolicy Exportable -NotAfter (Get-Date).AddDays(30)
          Export-PfxCertificate -Cert $c -FilePath $env:WSA_CI_PFX_PATH -Password (ConvertTo-SecureString $env:WSA_CI_PFX_PASSWORD -AsPlainText -Force) | Out-Null
          Remove-Item ('Cert:\LocalMachine\My\' + $c.Thumbprint)
          $c.Thumbprint
          '@
          Remove-Item Env:WSA_CI_PFX_PATH, Env:WSA_CI_PFX_PASSWORD
          $env:WSA_CERT_PFX_PASSWORD = $pfxPassword
          $null = Invoke-BootstrapperInstall @("--cert-pfx", $pfxPath)
          Remove-Item Env:WSA_CERT_PFX_PASSWORD
          $pfxSettings = Get-Content $securitySettingsPath -Raw | ConvertFrom-Json
          if ($pfxSettings.Tls.Thumbprint -ne $pfxThumbprint -or $pfxSettings.Installer.CertificateSource -ne "Pfx") {
            throw "The PFX certificate was not imported and remembered."
          }
          if (-not (Get-Item "Cert:\LocalMachine\My\$($pfxThumbprint)" -ErrorAction SilentlyContinue)) {
            throw "The PFX import did not put the certificate in the machine store."
          }
          Wait-ServedThumbprint $smokePort $pfxThumbprint

          # A wrong thumbprint must be refused with a message, before anything is changed.
          $refused = & $bootstrapperExe install-services --install-root $installRoot --cert-thumbprint ("0" * 40) 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0 -or $refused -notmatch "No certificate with thumbprint") {
            throw "An unknown certificate thumbprint was not refused clearly: $refused"
          }
          # The refusal above is the expected failure; do not let its exit code become the step's.
          $global:LASTEXITCODE = 0
          Wait-ServedThumbprint $smokePort $pfxThumbprint

          $uninstaller = Join-Path $installRoot "Uninstall.exe"
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList "/S" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "Uninstaller smoke test failed with exit code $($uninstall.ExitCode)."
          }

          Start-Sleep -Seconds 1
          if (Test-Path $installRoot) {
            throw "Uninstaller smoke test left the application installation directory behind."
          }
          if (Get-NetFirewallRule -DisplayName "WellSiteAutoPilot.Server" -ErrorAction SilentlyContinue) {
            throw "Uninstaller left the Server firewall rule behind."
          }

          foreach ($serviceName in $services) {
            if (Get-Service -Name $serviceName -ErrorAction SilentlyContinue) {
              throw "Uninstaller smoke test left Windows service registered: $serviceName"
            }
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: WellSiteAutoPilot-installer-${{ github.run_number }}
          path: |
            artifacts/*-Setup.exe
            artifacts/release-manifest.json
            artifacts/openapi/v1/server.json
          if-no-files-found: error
          retention-days: 14

  persistence-integration:
    name: PostgreSQL migration integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WSA_DATABASE_CONNECTION_STRING: Host=127.0.0.1;Port=5432;Database=wellsite_autopilot;Username=wsa;Password=wsa_ci_password

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wsa
          POSTGRES_PASSWORD: wsa_ci_password
          POSTGRES_DB: wellsite_autopilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wsa -d wellsite_autopilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore WellSiteAutoPilot.slnx

      - name: Build
        run: dotnet build WellSiteAutoPilot.slnx --configuration Release --no-restore

      - name: Apply migrations to clean PostgreSQL
        run: dotnet run --project tools/WellSiteAutoPilot.DatabaseMigrator/WellSiteAutoPilot.DatabaseMigrator.csproj --configuration Release --no-build

      - name: Verify migrations are idempotently current
        run: dotnet run --project tools/WellSiteAutoPilot.DatabaseMigrator/WellSiteAutoPilot.DatabaseMigrator.csproj --configuration Release --no-build

      - name: Verify shadow execution persistence and outbox
        run: dotnet run --project tests/WellSiteAutoPilot.ExecutionPersistenceTests/WellSiteAutoPilot.ExecutionPersistenceTests.csproj --configuration Release --no-build

      - name: Verify scheduled Shadow scheduler
        run: dotnet run --project tests/WellSiteAutoPilot.ScheduledShadowSchedulerTests/WellSiteAutoPilot.ScheduledShadowSchedulerTests.csproj --configuration Release --no-build

      - name: Verify Recommendation persistence
        run: dotnet run --project tests/WellSiteAutoPilot.RecommendationPersistenceTests/WellSiteAutoPilot.RecommendationPersistenceTests.csproj --configuration Release --no-build

      - name: Verify security identity, RBAC, and Asset scope persistence
        run: dotnet run --project tests/WellSiteAutoPilot.SecurityPersistenceTests/WellSiteAutoPilot.SecurityPersistenceTests.csproj --configuration Release --no-build

      - name: Verify authenticated identity persistence and claims
        run: dotnet run --project tests/WellSiteAutoPilot.IdentityBoundaryTests/WellSiteAutoPilot.IdentityBoundaryTests.csproj --configuration Release --no-build -- --persistence

      - name: Verify asset persistence
        run: dotnet run --project tests/WellSiteAutoPilot.AssetPersistenceTests/WellSiteAutoPilot.AssetPersistenceTests.csproj --configuration Release --no-build

      - name: Verify Asset REST create, schema validation and scope using real PostgreSQL
        shell: bash
        env:
          ASPNETCORE_ENVIRONMENT: CI
          Security__AuthenticationMode: TestHeader
          Security__BootstrapAdministrators__0: 'LOCAL\ci-asset-admin'
          WSA_ASSET_API_URL: http://127.0.0.1:5085
        run: |
          set -euo pipefail
          export WSA_DATABASE_CONNECTION_STRING="${WSA_DATABASE_CONNECTION_STRING/Database=wellsite_autopilot/Database=wsa_asset_api}"
          dotnet run --project tests/WellSiteAutoPilot.AssetApiTests/WellSiteAutoPilot.AssetApiTests.csproj --configuration Release --no-build -- --prepare
          dotnet run --project tools/WellSiteAutoPilot.DatabaseMigrator/WellSiteAutoPilot.DatabaseMigrator.csproj --configuration Release --no-build
          dotnet run --project src/server/WellSiteAutoPilot.Server/WellSiteAutoPilot.Server.csproj             --configuration Release --no-build -- --urls http://127.0.0.1:5085             > /tmp/wsa-asset-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..45}; do
            if curl --silent --fail http://127.0.0.1:5085/health/live >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/wsa-asset-server.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/wsa-asset-server.log
            exit 1
          fi
          # Keep the client and server output so an abort leaves its last lines in the annotations
          # (job logs are not always readable); the step still fails with the client's exit code.
          annotate() {
            printf '::error title=%s::' "$1"
            tail -n 25 "$2" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e ':a;N;$!ba;s/\n/%0A/g' | cut -c1-3500
          }
          client_status=0
          dotnet run --project tests/WellSiteAutoPilot.AssetApiTests/WellSiteAutoPilot.AssetApiTests.csproj             --configuration Release --no-build > /tmp/wsa-asset-client.log 2>&1 || client_status=$?
          cat /tmp/wsa-asset-client.log
          if [ "$client_status" -ne 0 ]; then
            annotate "Asset API test failed (exit $client_status)" /tmp/wsa-asset-client.log
            annotate "Asset API server log" /tmp/wsa-asset-server.log
            exit "$client_status"
          fi

      - name: Verify Configured Logic persistence
        run: dotnet run --project tests/WellSiteAutoPilot.ConfiguredLogicPersistenceTests/WellSiteAutoPilot.ConfiguredLogicPersistenceTests.csproj --configuration Release --no-build

      - name: Verify Logic Module catalog persistence
        run: dotnet run --project tests/WellSiteAutoPilot.LogicModuleCatalogTests/WellSiteAutoPilot.LogicModuleCatalogTests.csproj --configuration Release --no-build


  messaging-integration:
    name: NATS JetStream integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WSA_NATS_URL: nats://127.0.0.1:4222

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Start NATS with JetStream
        run: |
          docker run --detach --name wsa-nats-ci --publish 4222:4222 nats:2.15.0-alpine -js
          for attempt in {1..30}; do
            if docker logs wsa-nats-ci 2>&1 | grep -q "Server is ready"; then
              exit 0
            fi
            sleep 1
          done
          docker logs wsa-nats-ci
          exit 1

      - name: Restore
        run: dotnet restore WellSiteAutoPilot.slnx

      - name: Build
        run: dotnet build WellSiteAutoPilot.slnx --configuration Release --no-restore

      - name: Verify JetStream topology and deduplication
        run: dotnet run --project tests/WellSiteAutoPilot.MessagingIntegrationTests/WellSiteAutoPilot.MessagingIntegrationTests.csproj --configuration Release --no-build

      - name: Show NATS logs on failure
        if: failure()
        run: docker logs wsa-nats-ci

      - name: Stop NATS
        if: always()
        run: docker rm --force wsa-nats-ci


