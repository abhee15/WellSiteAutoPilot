name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  dotnet-build:
    name: .NET build
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore WellSiteAutoPilot.slnx

      - name: Build
        run: dotnet build WellSiteAutoPilot.slnx --configuration Release --no-restore

      - name: Publish server
        run: dotnet publish src/server/WellSiteAutoPilot.Server/WellSiteAutoPilot.Server.csproj --configuration Release --no-build --output artifacts/server

      - name: Publish integration gateway
        run: dotnet publish src/integration/WellSiteAutoPilot.IntegrationGateway/WellSiteAutoPilot.IntegrationGateway.csproj --configuration Release --no-build --output artifacts/gateway

      - name: Publish .NET worker
        run: dotnet publish src/workers/WellSiteAutoPilot.Worker.DotNet/WellSiteAutoPilot.Worker.DotNet.csproj --configuration Release --no-build --output artifacts/worker-dotnet

      - name: Publish provider simulator
        run: dotnet publish src/simulators/WellSiteAutoPilot.ProviderSimulator/WellSiteAutoPilot.ProviderSimulator.csproj --configuration Release --no-build --output artifacts/provider-simulator

      - name: Upload foundation binaries
        uses: actions/upload-artifact@v4
        with:
          name: WellSiteAutoPilot-foundation-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
