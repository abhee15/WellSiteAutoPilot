name: Module authoring kit

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'modules/authoring/**'
      - 'modules/samples/structured-cards/**'
      - 'src/modules/WellSiteAutoPilot.ModuleSdk/**'
      - 'tools/WellSiteAutoPilot.Cli/**'
      - 'src/server/WellSiteAutoPilot.Application/Logic/**'
      - 'src/server/WellSiteAutoPilot.Application/Assets/AssetAttributeSchemaValidator.cs'
      - 'src/server/WellSiteAutoPilot.Domain/Logic/**'
      - 'src/workers/WellSiteAutoPilot.Worker.DotNet/Execution/ModuleExecutionEngine.cs'
      - 'src/workers/WellSiteAutoPilot.Worker.DotNet/Execution/DotNetModulePackageHost.cs'
      - 'src/workers/WellSiteAutoPilot.Worker.DotNet/Execution/ModulePackageSource.cs'
      - 'src/workers/WellSiteAutoPilot.Worker.DotNet/WellSiteAutoPilot.Worker.DotNet.csproj'
      - 'tests/WellSiteAutoPilot.ModuleSdkTests/**'
      - 'tests/WellSiteAutoPilot.LogicManifestTests/**'
      - 'tests/WellSiteAutoPilot.ExecutionContractV2Tests/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/module-authoring-kit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: module-authoring-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-parity:
    name: Offline module contract (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build template and offline host against product SDK
        run: dotnet build modules/authoring/dotnet/OfflineRunner/OfflineRunner.csproj --configuration Release
      - name: Validate manifests with product CLI
        run: |
          dotnet run --project tools/WellSiteAutoPilot.Cli --configuration Release -- module validate modules/authoring/dotnet/manifest.json
          dotnet run --project tools/WellSiteAutoPilot.Cli --configuration Release --no-build -- module validate modules/authoring/python/manifest.json
      - name: Publish .NET starter for package checks
        run: dotnet publish modules/authoring/dotnet/WellInputCheck --configuration Release --output modules/authoring/artifacts/dotnet-payload
      - name: Probe trusted .NET build and package round trip
        run: python modules/authoring/probes/build_package_probe.py --report modules/authoring/artifacts/build-package-probe.json
      - name: Retain authoring build probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authoring-build-probe-${{ matrix.os }}
          path: modules/authoring/artifacts/build-package-probe.json
          if-no-files-found: warn
      - name: Check both runtimes against identical cases
        env:
          WSA_TEST_DOTNET: '1'
          WSA_TEST_PACKAGES: '1'
        run: python -m unittest discover -s modules/authoring/tests -p 'test_*.py' -v
      - name: Verify SDK compatibility and worker failure handling
        run: |
          dotnet run --project tests/WellSiteAutoPilot.LogicManifestTests --configuration Release
          dotnet run --project tests/WellSiteAutoPilot.ModuleSdkTests --configuration Release
          dotnet run --project tests/WellSiteAutoPilot.ExecutionContractV2Tests --configuration Release
